<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход | Custom Studio</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --blue: #004A97;
  --blue-dark: #003b78;
  --black: #000000;
  --white: #FFFFFF;
  --blue-light: #E6EEF7;
  --grey: #6B7280;
  --border: #E3E6EB;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--white); color:var(--black); font-family:'Inter',Arial,sans-serif; line-height:1.5; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.topbar { border-bottom: 1px solid var(--border); padding: 16px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--white); z-index:20; }
.logo-link { display:flex; align-items:center; gap:10px; text-decoration:none; }
.logo-mark { width: 30px; height: 30px; display:block; }
.logo-word { font-weight:800; font-size:14px; text-transform:uppercase; letter-spacing:0.01em; color:var(--black); }

.pill { padding:6px 12px; border-radius:20px; font-size:12px; font-weight:700; }
.pill.demo { background: var(--blue-light); color: var(--blue); }
.pill.member { background:#E7F5EA; color:#1A7A3A; }
.auth-status { display:flex; align-items:center; gap:12px; font-size:13px; font-weight:600; }

.btn-small { border:1.5px solid var(--blue); color:var(--blue); background:none; padding:7px 14px; border-radius:6px; font-family:'Inter',Arial,sans-serif; font-weight:700; font-size:13px; cursor:pointer; text-decoration:none; display:inline-block; }
.btn-small:hover { background: var(--blue-light); }
.btn-small.solid { background: var(--blue); color: var(--white); }
.btn-small.solid:hover { background: var(--blue-dark); }

.breadcrumbs { max-width: 780px; margin: 0 auto; padding: 20px 24px 0; font-size: 13px; color: var(--grey); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.breadcrumbs a { color: var(--grey); text-decoration:none; font-weight:600; }
.breadcrumbs a:hover { color: var(--blue); }
.breadcrumbs .current { color: var(--black); font-weight:600; }
.breadcrumbs .sep { color: #C7CBD2; }


.wrap { min-height: calc(100vh - 64px); display:flex; align-items:center; justify-content:center; padding: 24px; }
.card { width: 100%; max-width: 400px; }
h1 { font-size: 28px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
.sub { color: var(--grey); font-size: 15px; margin: 0 0 28px; }
label { display:block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
input[type="text"], input[type="password"] { width:100%; border:1.5px solid #D8DCE3; padding:13px 14px; border-radius:6px; font-size:15px; font-family:'Inter',Arial,sans-serif; margin-bottom:18px; }
input:focus { outline:none; border-color: var(--blue); }
.btn { width:100%; background:var(--blue); color:var(--white); border:none; padding:14px; font-family:'Inter',Arial,sans-serif; font-weight:700; font-size:15px; border-radius:6px; cursor:pointer; }
.btn:hover { background: var(--blue-dark); }
.error-msg { display:none; background:#FDECEC; color:#B42318; font-size:13px; font-weight:500; padding:10px 12px; border-radius:6px; margin:-8px 0 18px; }
.error-msg.show { display:block; }
.demo-link { text-align:center; margin-top:24px; font-size:14px; }
.demo-link a { color: var(--blue); font-weight:600; text-decoration:none; }
.demo-link a:hover { text-decoration:underline; }
</style>
</head>
