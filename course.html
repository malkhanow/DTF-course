// --- Access check ---
if (sessionStorage.getItem('dtf_logged_in') !== 'true') {
  window.location.href = 'index.html';
} else {
  document.getElementById('lockedNote').style.display = 'none';
  document.getElementById('courseShell').style.display = 'block';
  renderCourse();
}

document.getElementById('logoutBtn').addEventListener('click', function () {
  sessionStorage.removeItem('dtf_logged_in');
  sessionStorage.removeItem('dtf_user');
  window.location.href = 'index.html';
});

function renderCourse() {
  const root = document.getElementById('chapters');
  COURSE.forEach((chapter, i) => {
    const div = document.createElement('div');
    div.className = 'chapter';

    const toggle = document.createElement('button');
    toggle.className = 'chapter-toggle';
    toggle.innerHTML = `
      <span class="chapter-num">${String(i + 1).padStart(2, '0')}</span>
      <span class="chapter-title">${chapter.title.replace(/^\d+\.\s*/, '')}</span>
      <span class="chapter-count">${chapter.lessons.length} урок(ов)</span>
      <span class="chapter-arrow">›</span>
    `;
    toggle.addEventListener('click', () => div.classList.toggle('open'));

    const list = document.createElement('div');
    list.className = 'lesson-list';
    chapter.lessons.forEach(lesson => {
      const a = document.createElement('a');
      a.className = 'lesson-item';
      a.href = lesson.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `
        <span>${lesson.n} ${lesson.title}</span>
        ${lesson.video ? '<span class="lesson-video-tag">Видео</span>' : ''}
      `;
      list.appendChild(a);
    });

    div.appendChild(toggle);
    div.appendChild(list);
    root.appendChild(div);
  });
}
</script>
