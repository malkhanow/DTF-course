<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Курс по DTF-печати</title>
<style>
/* ===========================================================
   DTF Course — design tokens
   Palette:
     --ink        #17181C  (background, "unprinted" dark film)
     --paper      #F3EFE6  (card/text, PET film warm white)
     --transfer   #FF5A2E  (heat-transfer orange — primary accent)
     --cyan       #2FD1C2  (process-cyan — secondary accent)
     --steel      #34363C  (borders, secondary surfaces)
     --steel-2    #4B4E56  (muted text on dark)
   Type:
     display: 'Oswald' (condensed industrial, stencil-adjacent)
     body:    'Manrope'
   Signature element: registration crosshair marks (used in print
   production to align color layers) as numbering / section markers.
   =========================================================== */

@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap');

:root {
  --ink: #17181C;
  --paper: #F3EFE6;
  --transfer: #FF5A2E;
  --cyan: #2FD1C2;
  --steel: #34363C;
  --steel-2: #8A8D94;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--ink);
  color: var(--paper);
  font-family: 'Manrope', system-ui, sans-serif;
  min-height: 100vh;
}

h1, h2, h3, .display {
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-weight: 600;
  margin: 0;
}

a { color: inherit; }

/* Registration crosshair — the signature device */
.crosshair {
  display: inline-block;
  width: 14px;
  height: 14px;
  position: relative;
  flex-shrink: 0;
}
.crosshair::before,
.crosshair::after {
  content: '';
  position: absolute;
  background: var(--transfer);
}
.crosshair::before { width: 100%; height: 2px; top: 50%; left: 0; transform: translateY(-50%); }
.crosshair::after { width: 2px; height: 100%; left: 50%; top: 0; transform: translateX(-50%); }
.crosshair-ring {
  position: absolute;
  inset: -5px;
  border: 1px solid var(--transfer);
  border-radius: 50%;
  opacity: 0.55;
}

:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- Login page ---------- */
.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(circle at 20% 15%, rgba(255,90,46,0.10), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(47,209,194,0.08), transparent 45%),
    var(--ink);
}

.login-card {
  width: 100%;
  max-width: 400px;
  background: var(--steel);
  border: 1px solid #44474e;
  border-radius: 4px;
  padding: 40px 32px;
  position: relative;
}

.login-eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--steel-2);
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  font-size: 12px;
  letter-spacing: 0.12em;
  margin-bottom: 14px;
}

.login-card h1 {
  font-size: 26px;
  margin-bottom: 6px;
  color: var(--paper);
}

.login-sub {
  color: var(--steel-2);
  font-size: 14px;
  margin-bottom: 28px;
  line-height: 1.5;
}

label {
  display: block;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--steel-2);
  margin-bottom: 6px;
  font-family: 'Oswald', sans-serif;
}

input[type="text"], input[type="password"] {
  width: 100%;
  background: var(--ink);
  border: 1px solid #4B4E56;
  color: var(--paper);
  padding: 12px 14px;
  border-radius: 3px;
  font-size: 15px;
  font-family: 'Manrope', sans-serif;
  margin-bottom: 18px;
}
input[type="text"]:focus, input[type="password"]:focus {
  border-color: var(--transfer);
}

.btn {
  width: 100%;
  background: var(--transfer);
  color: var(--ink);
  border: none;
  padding: 13px;
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
  font-size: 14px;
  border-radius: 3px;
  cursor: pointer;
  transition: filter 0.15s ease;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { filter: brightness(0.94); }

.error-msg {
  display: none;
  color: var(--transfer);
  font-size: 13px;
  margin: -10px 0 18px;
}
.error-msg.show { display: block; }

/* ---------- Course page ---------- */
.course-shell {
  max-width: 760px;
  margin: 0 auto;
  padding: 48px 24px 80px;
}

.course-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 40px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--steel);
}

.course-header .eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--steel-2);
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  font-size: 12px;
  letter-spacing: 0.12em;
  margin-bottom: 10px;
}

.course-header h1 { font-size: 30px; }

.logout-btn {
  background: none;
  border: 1px solid var(--steel-2);
  color: var(--steel-2);
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  font-size: 12px;
  letter-spacing: 0.06em;
  padding: 8px 14px;
  border-radius: 3px;
  cursor: pointer;
  white-space: nowrap;
}
.logout-btn:hover { border-color: var(--transfer); color: var(--transfer); }

.chapter {
  border: 1px solid var(--steel);
  border-radius: 4px;
  margin-bottom: 12px;
  overflow: hidden;
  background: #1C1E23;
}

.chapter-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  background: none;
  border: none;
  color: var(--paper);
  padding: 18px 20px;
  cursor: pointer;
  text-align: left;
  font-family: 'Manrope', sans-serif;
}

.chapter-num {
  font-family: 'Oswald', sans-serif;
  color: var(--transfer);
  font-size: 13px;
  min-width: 20px;
}

.chapter-title {
  flex: 1;
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  font-size: 16px;
  letter-spacing: 0.01em;
}

.chapter-count {
  color: var(--steel-2);
  font-size: 12px;
  font-family: 'Oswald', sans-serif;
}

.chapter-arrow {
  color: var(--steel-2);
  transition: transform 0.2s ease;
  flex-shrink: 0;
}
.chapter.open .chapter-arrow { transform: rotate(90deg); color: var(--transfer); }

.lesson-list {
  display: none;
  border-top: 1px solid var(--steel);
}
.chapter.open .lesson-list { display: block; }

.lesson-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 20px 13px 48px;
  text-decoration: none;
  color: var(--paper);
  font-size: 14.5px;
  border-bottom: 1px solid #26282E;
}
.lesson-item:last-child { border-bottom: none; }
.lesson-item:hover { background: #23252B; color: var(--cyan); }

.lesson-video-tag {
  margin-left: auto;
  font-family: 'Oswald', sans-serif;
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--cyan);
  border: 1px solid var(--cyan);
  border-radius: 2px;
  padding: 2px 6px;
  flex-shrink: 0;
}

.locked-note {
  display: none;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--steel-2);
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

</style>
</head>
<body>

<div class="locked-note" id="lockedNote">Проверка доступа…</div>

<div class="course-shell" id="courseShell" style="display:none;">
  <div class="course-header">
    <div>
      <div class="eyebrow">
        <span class="crosshair"><span class="crosshair-ring"></span></span>
        CUSTOM STUDIO
      </div>
      <h1>Курс по DTF-печати</h1>
    </div>
    <button class="logout-btn" id="logoutBtn">Выйти</button>
  </div>

  <div id="chapters"></div>
</div>

      { n: "7", title: "Завершение курса", url: "https://teletype.in/@cstmstd/1A0Mc9V8nys", video: true }
    ]
  }
];

// --- Access check ---
if (sessionStorage.getItem('dtf_logged_in') !== 'true') {
  window.location.href = 'index.html';
} else {
  document.getElementById('lockedNote').style.display = 'none';
  document.getElementById('courseShell').style.display = 'block';
  renderCourse();
}

document.getElementById('logoutBtn').addEventListener('click', function () {
  sessionStorage.removeItem('dtf_logged_in');
  sessionStorage.removeItem('dtf_user');
  window.location.href = 'index.html';
});

function renderCourse() {
  const root = document.getElementById('chapters');
  COURSE.forEach((chapter, i) => {
    const div = document.createElement('div');
    div.className = 'chapter';

    const toggle = document.createElement('button');
    toggle.className = 'chapter-toggle';
    toggle.innerHTML = `
      <span class="chapter-num">${String(i + 1).padStart(2, '0')}</span>
      <span class="chapter-title">${chapter.title.replace(/^\d+\.\s*/, '')}</span>
      <span class="chapter-count">${chapter.lessons.length} урок(ов)</span>
      <span class="chapter-arrow">›</span>
    `;
    toggle.addEventListener('click', () => div.classList.toggle('open'));

    const list = document.createElement('div');
    list.className = 'lesson-list';
    chapter.lessons.forEach(lesson => {
      const a = document.createElement('a');
      a.className = 'lesson-item';
      a.href = lesson.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `
        <span>${lesson.n} ${lesson.title}</span>
        ${lesson.video ? '<span class="lesson-video-tag">Видео</span>' : ''}
      `;
      list.appendChild(a);
    });

    div.appendChild(toggle);
    div.appendChild(list);
    root.appendChild(div);
  });
}
</script>
