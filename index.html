<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход в курс — DTF-печать</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-eyebrow">
      <span class="crosshair"><span class="crosshair-ring"></span></span>
      CUSTOM STUDIO
    </div>
    <h1>Курс по DTF-печати</h1>
    <p class="login-sub">Введите логин и пароль, которые вам выдали после оплаты.</p>

    <form id="loginForm" autocomplete="off">
      <label for="login">Логин</label>
      <input type="text" id="login" name="login" autocomplete="username" required>

      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <p class="error-msg" id="errorMsg">Неверный логин или пароль. Проверьте данные и попробуйте ещё раз.</p>

      <button type="submit" class="btn">Войти</button>
    </form>
  </div>
</div>

<script src="js/credentials.js"></script>
<script>
  // Если уже залогинен — сразу на страницу курса
  if (sessionStorage.getItem('dtf_logged_in') === 'true') {
    window.location.href = 'course.html';
  }

  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const login = document.getElementById('login').value.trim();
    const password = document.getElementById('password').value.trim();

    const match = VALID_CREDENTIALS.some(
      c => c.login === login && c.password === password
    );

    if (match) {
      sessionStorage.setItem('dtf_logged_in', 'true');
      sessionStorage.setItem('dtf_user', login);
      window.location.href = 'course.html';
    } else {
      errorMsg.classList.add('show');
    }
  });
</script>

</body>
</html>
